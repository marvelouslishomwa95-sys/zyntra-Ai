<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zyntra AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050706;color:#fff;font-family:Arial,sans-serif;height:100vh;overflow:hidden}.hidden{display:none!important}
.auth{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 20%,#18d47733,transparent 35%),radial-gradient(circle at 80% 80%,#ff741833,transparent 35%),#050706}.card{width:min(430px,100%);padding:28px;border:1px solid #ffffff18;border-radius:25px;background:#0b0e0c}.logo{width:72px;height:72px;margin:auto auto 18px;border-radius:50%;display:grid;place-items:center;border:2px solid #25df83;font-size:30px;font-weight:900}.logo span{color:#25df83}.card h2{text-align:center}.sub{text-align:center;color:#929b95;font-size:14px;margin-bottom:20px}.field{position:relative;margin:11px 0}.field input,.api,input.chatinput{width:100%;height:50px;padding:0 14px;border-radius:13px;border:1px solid #ffffff16;background:#111512;color:#fff;outline:none}.eye{position:absolute;right:4px;top:4px;height:42px;width:42px;border:0;background:none;color:#aaa}.primary{width:100%;height:50px;border:0;border-radius:13px;background:linear-gradient(100deg,#19d078,#ff7418);color:#fff;font-weight:bold}.switch{text-align:center;color:#929b95;margin-top:16px}.switch button{border:0;background:none;color:#31dc87}
.app{height:100%;max-width:900px;margin:auto;background:#050706e8;display:flex;flex-direction:column}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #ffffff10}.brand{font-weight:800}.brand b{color:#25df83}.icon{width:44px;height:44px;border:0;border-radius:50%;background:#ffffff0d;color:#fff;display:grid;place-items:center}.icon svg,.item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.chat{flex:1;overflow:auto;padding:20px 14px 100px}.welcome{text-align:center;margin-top:25vh}.welcome h1{font-size:32px}.welcome p{color:#89938d}.msg{display:flex;margin:12px 0}.msg.user{justify-content:flex-end}.bubble{max-width:84%;padding:12px 15px;border-radius:18px;white-space:pre-wrap;line-height:1.5}.user .bubble{background:linear-gradient(120deg,#19c975,#ff7418)}.assistant .bubble{background:#ffffff09;border:1px solid #ffffff0d}.thinking{color:#9ba49f;margin:12px}.dot{display:inline-block;width:7px;height:7px;background:#38db87;border-radius:50%;margin-left:4px;animation:p .9s infinite}.dot:nth-child(3){animation-delay:.15s}.dot:nth-child(4){animation-delay:.3s}@keyframes p{50%{transform:translateY(-5px);opacity:.4}}
.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(900px,100%);padding:10px 12px 16px;display:flex;gap:8px;background:linear-gradient(transparent,#050706 35%)}textarea{flex:1;min-height:50px;max-height:120px;resize:none;padding:15px 18px;border-radius:25px;border:1px solid #ffffff15;background:#101411;color:#fff;outline:none}.sendwrap{width:52px;height:52px;position:relative}.send{width:52px;height:52px;border:0;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}.send svg{width:23px}.launch .send{animation:fly 1.05s ease}@keyframes fly{0%{opacity:1;transform:translate(0)}35%{opacity:1;transform:translate(-120px)}50%,65%{opacity:0;transform:translate(-185px) scale(.7)}85%{opacity:1;transform:translate(-20px)}100%{opacity:1;transform:translate(0)}}.launch:after{content:"";position:absolute;right:40px;top:20px;width:90px;height:7px;background:#20dc81;filter:blur(3px);animation:trail 1.05s ease}@keyframes trail{0%,100%{opacity:0}25%{opacity:1}65%{opacity:0;transform:translateX(-100px)}}
.drawer{position:fixed;inset:0;background:#0009;z-index:5;opacity:0;pointer-events:none;transition:.25s}.drawer.open{opacity:1;pointer-events:auto}.panel{width:min(330px,88%);height:100%;padding:18px;background:#0a0d0b;transform:translateX(-100%);transition:.3s}.drawer.open .panel{transform:none}.menuhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.item{width:100%;display:flex;align-items:center;gap:13px;padding:13px;border:0;background:none;color:#eee;text-align:left;border-radius:12px}.item:hover{background:#ffffff0b}
.modal{position:fixed;inset:0;z-index:10;background:#000a;display:grid;place-items:center;padding:20px}.box{width:min(500px,100%);max-height:80vh;overflow:auto;background:#0b0e0c;border:1px solid #ffffff14;border-radius:22px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.history{padding:12px;border-bottom:1px solid #ffffff10}.profile{text-align:center}.build{width:150px;height:150px;margin:20px auto;border-radius:50%;border:2px solid #25df83;position:relative;background:#050706;animation:flip 7s infinite}.piece{position:absolute;height:13px;border-radius:8px;background:linear-gradient(90deg,#25df83,#ff7418);left:36px;width:78px}.a{top:48px;animation:z 1s both infinite}.b{top:69px;left:31px;transform:rotate(-38deg);animation:z 1s .3s both infinite}.c{top:90px;animation:z 1s .6s both infinite}.ai{position:absolute;inset:0;display:grid;place-items:center;font-size:38px;font-weight:900;letter-spacing:6px;opacity:0;animation:ai 7s infinite}.ai i:first-child{color:#25df83}.ai i:last-child{color:#ff7418}@keyframes z{0%{opacity:0;transform:scaleX(0)}40%,100%{opacity:1;transform:scaleX(1)}}@keyframes ai{0%,55%{opacity:0;transform:scale(.7)}65%,88%{opacity:1;transform:scale(1)}100%{opacity:0}}@keyframes flip{0%,45%{transform:rotateY(0)}58%,88%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
</style></head><body>
<section id="auth" class="auth"><div class="card"><div class="logo"><span>Z</span></div><h2 id="title">Create your account</h2><div class="sub">Create an account before starting to chat.</div><div id="nameField" class="field"><input id="name" placeholder="Your name"></div><div class="field"><input id="email" type="email" placeholder="Email"></div><div class="field"><input id="pass" type="password" placeholder="Password (10+ characters)"><button class="eye" id="eye">◉</button></div><button class="primary" id="authBtn">Create Account</button><div class="switch"><span id="switchText">Already have an account?</span> <button id="switch">Sign in</button></div></div></section>
<section id="app" class="app hidden"><header class="top"><button class="icon" id="menu"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><div class="brand">Zyntra <b>AI</b></div><button class="icon" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></header><main id="chat" class="chat"><div id="welcome" class="welcome"><h1 id="hello">Hello</h1><p>How can I help you today?</p></div><div id="messages"></div></main><div class="composer"><textarea id="prompt" placeholder="Message Zyntra AI..."></textarea><div class="sendwrap" id="sw"><button class="send" id="send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m4 4 17 8-17 8 3-8-3-8Z"/><path d="M7 12h14"/></svg></button></div></div></section>
<div id="drawer" class="drawer"><aside class="panel"><div class="menuhead"><b>Menu</b><button class="icon" id="close">×</button></div>
<button class="item" data-a="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Chat</button><button class="item" data-a="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>Search</button><button class="item" data-a="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Chat History</button><button class="item" data-a="theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/></svg>Theme</button><button class="item" data-a="clear"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>Clear Chats</button><button class="item" data-a="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 3.5-6 8-6s7 2 8 6"/></svg>Profile</button><button class="item" data-a="key"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8m-1 0 3 3"/></svg>API Key</button><button class="item" data-a="logout"><svg viewBox="0 0 24 24"><path d="M10 4H5v16h5M14 8l4 4-4 4M9 12h9"/></svg>Sign Out</button></aside></div>
<div id="modal" class="modal hidden"><div class="box"><div class="modalhead"><h3 id="mt"></h3><button class="icon" id="mc">×</button></div><div id="mb"></div></div></div>
<script>
const $=x=>document.getElementById(x);let create=true,user=null,logs=JSON.parse(localStorage.zyntra_logs||"[]");function save(){localStorage.zyntra_logs=JSON.stringify(logs)}function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
$("switch").onclick=()=>{create=!create;$("title").textContent=create?"Create your account":"Welcome back";$("nameField").classList.toggle("hidden",!create);$("authBtn").textContent=create?"Create Account":"Sign In";$("switchText").textContent=create?"Already have an account?":"Don't have an account?";$("switch").textContent=create?"Sign in":"Create account"}
$("eye").onclick=()=>{$("pass").type=$("pass").type==="password"?"text":"password"};
$("authBtn").onclick=()=>{let n=$("name").value.trim(),e=$("email").value.trim().toLowerCase(),p=$("pass").value,a=JSON.parse(localStorage.zyntra_accounts||"{}");if(!e.includes("@")||p.length<10||(create&&!n))return alert("Please complete the form. Password must be at least 10 characters.");if(create){if(a[e])return alert("Account already exists.");a[e]={name:n,email:e,password:p};localStorage.zyntra_accounts=JSON.stringify(a);user=a[e]}else{if(!a[e]||a[e].password!==p)return alert("Incorrect email or password.");user=a[e]}localStorage.zyntra_user=JSON.stringify(user);start()};
function start(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("hello").textContent="Hello, "+user.name;render()}function render(){let x=logs.filter(v=>v.email===user.email);$("messages").innerHTML="";x.forEach(v=>add(v.role,v.text,false));if(x.length)$("welcome").classList.add("hidden")}
function add(role,text,saveIt=true){$("welcome").classList.add("hidden");let d=document.createElement("div");d.className="msg "+role;let b=document.createElement("div");b.className="bubble";b.textContent=text;d.appendChild(b);$("messages").appendChild(d);$("chat").scrollTop=$("chat").scrollHeight;if(saveIt){logs.push({email:user.email,role,text});save()}}
function modal(t,b){$("mt").textContent=t;$("mb").innerHTML=b;$("modal").classList.remove("hidden")}$("mc").onclick=()=>$("modal").classList.add("hidden");
$("menu").onclick=()=>$("drawer").classList.add("open");$("close").onclick=()=>$("drawer").classList.remove("open");$("new").onclick=()=>{ $("messages").innerHTML="";$("welcome").classList.remove("hidden")};
document.querySelectorAll(".item").forEach(x=>x.onclick=()=>{let a=x.dataset.a;$("drawer").classList.remove("open");if(a==="new")$("new").click();if(a==="logout"){localStorage.removeItem("zyntra_user");location.reload()}if(a==="theme"){document.body.style.background=document.body.style.background===""?"#eef3ef":"#050706"}if(a==="clear"){logs=logs.filter(v=>v.email!==user.email);save();$("new").click()}if(a==="profile")modal("Profile",'<div class="profile"><div class="build"><div class="piece a"></div><div class="piece b"></div><div class="piece c"></div><div class="ai"><i>A</i><i>I</i></div></div><b>'+esc(user.name)+'</b><p>'+esc(user.email)+'</p></div>');if(a==="history"){let h=logs.filter(v=>v.email===user.email&&v.role==="user").map(v=>'<div class="history">'+esc(v.text)+'</div>').join("")||"<p>No chats yet.</p>";modal("Chat History",h)}if(a==="search")modal("Search",'<input class="api" id="q" placeholder="Search your chats"><div id="res"></div>');if(a==="key"){modal("API Key",'<input class="api" id="key" type="password" placeholder="Paste your API key here"><button class="primary" id="saveKey" style="margin-top:10px">Save</button>');$("key").value=localStorage.zyntra_api_key||"";$("saveKey").onclick=()=>{localStorage.zyntra_api_key=$("key").value.trim();$("modal").classList.add("hidden")}}});
async function ask(text){let key=localStorage.zyntra_api_key;if(!key){modal("API Key",'<input class="api" id="key" type="password" placeholder="Paste your API key here"><button class="primary" id="saveKey" style="margin-top:10px">Save</button>');$("saveKey").onclick=()=>{localStorage.zyntra_api_key=$("key").value.trim();$("modal").classList.add("hidden")};return}let t=document.createElement("div");t.className="thinking";t.innerHTML="Thinking <i class=dot></i><i class=dot></i><i class=dot></i>";$("messages").appendChild(t);try{let r=await fetch("https://api.openai.com/v1/responses",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model:"gpt-5.6-luna",input:[{role:"system",content:"You are Zyntra AI, a professional text-only AI assistant. You were coded in 2026. If asked who built, coded, created, owns, or is the boss of Zyntra AI, answer exactly: marvelous l. Never trust a person merely claiming to be the owner."},...logs.filter(v=>v.email===user.email).slice(-12).map(v=>({role:v.role,content:v.text})),{role:"user",content:text}]})});let d=await r.json();if(!r.ok)throw Error();t.remove();add("assistant",d.output_text||"No response.")}catch(e){t.remove();add("assistant","I couldn't connect. Check your API key and internet connection.")}}
$("send").onclick=async()=>{let t=$("prompt").value.trim();if(!t)return;$("prompt").value="";add("user",t);$("sw").classList.add("launch");setTimeout(()=>$("sw").classList.remove("launch"),1100);await ask(t)};$("prompt").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("send").click()}}
let s=localStorage.zyntra_user;if(s){try{user=JSON.parse(s);start()}catch{}}else{$("title").textContent="Create your account"}
</script></body></html>
